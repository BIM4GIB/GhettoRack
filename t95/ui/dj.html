<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GhettoRack">
<meta name="theme-color" content="#0b0c0d">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Numark DJ</title>
<style>
/* The TV / Mac / iPad / phone layouts. Wide: decks on top, library and mixer below. Upright and
   short (a phone): one of the three at a time, picked on the tab row. Nothing scrolls: the
   library is paged. The 480x320 layout is small() below, with styles in small.css. */
:root{--bg:#0b0c0d;--panel:#15171a;--line:#2a2d31;--text:#d9dcdf;--dim:#7d848c;--green:#35d05a;--red:#ff4b3e;--yellow:#ffb833;--amber:#ff9a1f;--blue:#4aa3ff;--off:#23262a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  height:100dvh;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
body.tv{zoom:1.5;height:calc(100dvh / 1.5)}
header{display:flex;align-items:center;gap:10px 18px;padding:10px 18px;border-bottom:1px solid var(--line);background:#101214;min-width:0}
h1{font-size:18px;margin:0;letter-spacing:.1em;white-space:nowrap}
.chip{font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:7px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--off);flex:none}
.chip.ok::before{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.bad::before{background:var(--red);box-shadow:0 0 8px var(--red)}.chip.bad{color:var(--text)}
button{background:#1d2024;border:1px solid #3a3f45;border-radius:7px;color:#c3c8cd;font:inherit;font-size:13px;font-weight:600;min-height:40px;padding:0 8px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:hover{background:#24282c}
button:disabled{opacity:.35;cursor:default}
button.on{color:var(--amber);border-color:var(--amber);box-shadow:0 0 9px #ff9a1f77,inset 0 0 8px #ff9a1f33}
button.go{color:var(--green);border-color:var(--green);box-shadow:0 0 12px #35d05a66,inset 0 0 8px #35d05a33}
button.warn{color:#0b0c0d;background:var(--yellow);border-color:var(--yellow)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#home{min-height:36px}
.tabs{display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px 0}
.tabs button.sel{color:var(--text);border-color:var(--yellow)}
main{flex:1;min-height:0;min-width:0;padding:12px;display:grid;gap:12px}
section{min-height:0;min-width:0}
body.lay-wide main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"decks decks" "lib mix"}
body.lay-wide #s-decks{grid-area:decks}body.lay-wide #s-lib{grid-area:lib}body.lay-wide #s-mix{grid-area:mix}
body.lay-tabs .tabs{display:grid}
body.lay-tabs main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:8px 12px}
body.lay-tabs main>section:not(.show){display:none!important}
.msg{flex:none;font-family:var(--mono);font-size:12px;color:var(--dim);padding:6px 18px 8px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line)}
.msg.bad{color:var(--red)}
/* decks */
#s-decks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
body.upright #s-decks{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.deck{display:grid;grid-template-rows:auto minmax(40px,1fr) auto auto;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:0;min-width:0}
.deck.play{border-color:var(--green)}
.dhead{display:flex;align-items:center;gap:10px;min-width:0}
.dn{width:28px;height:28px;border-radius:6px;background:var(--off);color:var(--dim);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.deck.play .dn,.strip.play .dn{background:var(--green);color:#0b0c0d}
.dname{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dname.none{color:var(--dim);font-weight:400;font-size:14px}
.dtime{font-family:var(--mono);font-size:20px;white-space:nowrap}.dtime span{font-size:12px;color:var(--dim)}
.wave{position:relative;min-height:0;background:#101214;border-radius:6px;overflow:hidden;cursor:pointer}
.wave canvas{position:absolute;inset:0;width:100%;height:100%}
.drow{display:grid;grid-template-columns:minmax(46px,90px) minmax(50px,120px) minmax(50px,90px) minmax(80px,1fr) 12px minmax(56px,110px);gap:8px;align-items:stretch;min-height:44px}
.drow button{padding:0 2px}
body.upright .drow button,body.short .drow button{font-size:12px;padding:0}
.dpitch{display:flex;flex-direction:column;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;min-width:0;overflow:hidden}
.dpitch b{font-size:16px;color:var(--text)}
.vu{background:var(--off);border-radius:3px;position:relative;overflow:hidden}
.vu i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--green)}.vu i.over{background:var(--red)}
.nodecks{grid-column:1 / -1;grid-row:1 / -1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--dim);padding:0 20px}
.nodecks button{min-width:200px;min-height:48px;font-size:15px}
/* pads: 8 hot cues and the loop, a deck. Inside the deck when wide, a tab of their own on a phone */
.pads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:40px;gap:6px;min-width:0}
.pads button{padding:0;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.pads button span{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--dim)}
.pads button.on span{color:var(--text)}
#s-pads{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
body.lay-wide #s-pads{display:none}
body.short #s-pads{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.padbox{display:grid;grid-template-rows:auto auto;gap:8px;align-content:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;min-height:0}
.padbox.play{border-color:var(--green)}
.padbox .pads{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(44px,56px)}
body.short .padbox .pads{grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:44px}
body.short .padbox .pads button{font-size:11px}
/* library */
#s-lib{display:grid;grid-template-columns:minmax(0,1fr) 150px;grid-template-rows:auto minmax(0,1fr);gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.lpath{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden}
.lpath span{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:400}
.rows{display:grid;grid-auto-rows:44px;gap:4px;align-content:start;min-height:0;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;text-align:left;font-weight:400;font-size:14px;background:none;border-color:var(--line);color:#b9bec4;min-height:0;height:44px}
.li .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .d{font-family:var(--mono);font-size:11px;color:var(--dim)}
.li.dir{color:var(--amber)}
.li.sel{background:var(--off);border-color:var(--yellow);color:var(--text)}
.side{display:grid;grid-auto-rows:40px;gap:6px;align-content:start;min-height:0;overflow:hidden}
.nav{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;align-items:center;text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
.nav button{padding:0}
body.short #s-lib{grid-template-columns:minmax(0,1fr) 250px}
body.short .side{grid-template-columns:1fr 1fr}
body.short .side .nav{grid-column:1 / -1}
/* mixer */
#s-mix{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 34px auto;gap:8px;container-type:inline-size}
body.short #s-mix{grid-template-rows:minmax(0,1fr) 20px auto;gap:5px}
body.short .strip,body.short .master{padding:5px 8px;gap:4px}
body.short .sbtns{grid-template-columns:1fr 1fr 1fr}body.short .sbtns button:last-child{grid-column:auto}
body.short .sbtns button,body.short .fxrow button{min-height:30px}
body.short .fxrow button{font-size:11px;padding:0}
.strip,.master{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:0;min-width:0}
.strip.play{border-color:var(--green)}
.strip .dname{font-size:14px}.strip .dn{width:22px;height:22px;font-size:13px}
.sbody{display:grid;grid-template-columns:26px 12px minmax(0,1fr);gap:8px;min-height:0}
.fader{background:var(--off);border-radius:3px;position:relative}.fader i{position:absolute;left:0;right:0;bottom:0;background:var(--blue);border-radius:3px}
.knobs{display:grid;grid-template-rows:repeat(5,1fr);gap:4px;min-height:0}
.k{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.k.w{grid-template-columns:58px minmax(0,1fr)}
.bar{height:10px;background:var(--off);border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--blue)}.bar u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--dim)}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sbtns button{padding:0 2px;font-size:12px}.sbtns button:last-child{grid-column:1 / -1}
.fxrow{grid-column:1 / -1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,1.6fr) minmax(0,1.6fr);gap:6px;min-width:0}
.fxrow button{padding:0 2px;font-size:12px;min-height:34px}
.fxrow .step{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:3px;align-items:center;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.fxrow .step button{min-height:34px;padding:0}
@container (max-width: 640px){.fxrow{grid-template-columns:repeat(6,minmax(0,1fr))}.fxrow .step{grid-column:span 3}.fxrow button{font-size:11px;padding:0}}
.master .t{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center}
.mm{display:grid;grid-template-columns:1fr 16px 16px 1fr;gap:5px;min-height:0;font-family:var(--mono);font-size:11px;color:var(--dim)}
.mm span{align-self:end;text-align:center}
.phones{display:grid;gap:4px}
.xf{grid-column:1 / -1;display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.xf span:last-child{text-align:right}
body.upright #s-mix{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) 130px 30px auto}
body.upright #s-mix .fxrow{grid-row:4}
body.upright #s-mix .master{grid-column:1 / -1;grid-row:2}
body.upright #s-mix .xf{grid-row:3}
.xf .bar{height:16px}.xf .bar b{position:absolute;top:0;bottom:0;width:30px;margin-left:-15px;background:var(--blue);border-radius:3px}
</style>
</head>
<body>
<script src="/small.js"></script>
<script>
"use strict";
const tv = new URLSearchParams(location.search).has("tv");

/* ---- what both layouts share: the box's picture of the decks, and asking it ----
   The engine (decks/, deckd) keeps time and makes the sound; the bridge keeps the last picture
   (rackbridge/decks.py). This page shows it and asks: nothing here times anything. */
const D = { S: null, waves: {}, files: [], info: {}, copy: null, at: 0, bad: false, loading: false, on: null };
const es = new EventSource("/events?view=dj");
async function post(path, body) {
  try { return await (await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json(); }
  catch (e) { return { error: "the box isn't answering" }; }
}
const ask = (a, more) => post("/decks", Object.assign({ a }, more || {}));
async function full() {
  if (D.loading) return; D.loading = true;
  try { const j = await (await fetch("/decks")).json();
    D.S = j; D.waves = j.waves || {}; D.files = j.files || []; D.info = j.info || {}; D.copy = D.info.copy || D.copy; D.at = performance.now(); D.bad = false; }
  catch (e) { D.bad = true; }
  D.loading = false; if (D.on) D.on(true);
}
function stale() {            /* a track or the folder changed since the outlines and the file list were fetched */
  const S = D.S; if (!S || !S.running) return false;
  for (let i = 0; i < 2; i++) { const t = (S.decks[i] || {}).track || 0, w = D.waves[i + 1]; if (t ? !w || w.track !== t : !!w) return true; }
  return !!S.browse && S.browse.count !== undefined && S.browse.count !== D.files.length;
}
es.addEventListener("decks", e => { try { const was = D.S && D.S.running; D.S = Object.assign(D.S || {}, JSON.parse(e.data)); D.at = performance.now(); D.bad = false;
  if (stale() || was !== D.S.running) full(); else if (D.on) D.on(false); } catch (err) {} });
es.addEventListener("decks_copy", e => { try { D.copy = JSON.parse(e.data); if (D.on) D.on(false); } catch (err) {} });
es.onerror = () => { D.bad = true; if (D.on) D.on(false); };
es.onopen = () => { full(); };
const deck = i => (D.S && D.S.decks && D.S.decks[i]) || {};
const tm = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const pct = x => (x >= 0.00005 ? "+" : x <= -0.00005 ? "-" : "") + Math.abs(x * 100).toFixed(1) + "%";
const peaks = (i, n) => { const w = D.waves[i + 1], out = []; if (!w) return out; const hex = w.peaks, m = hex.length / 2;
  for (let k = 0; k < n; k++) { let p = 0; for (let j = Math.floor(k * m / n); j < Math.max(Math.floor(k * m / n) + 1, Math.floor((k + 1) * m / n)); j++) p = Math.max(p, parseInt(hex.substr(j * 2, 2), 16)); out.push(p / 255); }
  return out; };
function status() {           /* [text, class] for the top bar */
  const S = D.S;
  if (D.bad || !S) return ["the box isn't answering", "bad"];
  if (!S.wanted) return ["decks off", "off"];
  if (!S.running) return [/sound card/.test(S.error || "") ? "no Numark" : "decks not running", "bad"];
  return [S.decks.some(d => d.playing) ? "playing" : "stopped", S.decks.some(d => d.playing) ? "ok" : "off"];
}
function why() {              /* the line under a deck that is not there */
  const S = D.S;
  if (D.bad || !S) return "The box isn't answering.";
  if (!S.wanted) return "The decks are off: another module is the active one.";
  if (/sound card/.test(S.error || "")) return "Plug in the Numark. The decks play through its outputs.";
  return S.error || "The decks are starting.";
}
const rateNow = d => d.rate_now === undefined ? d.rate || 0 : d.rate_now;                 /* the pitch slider's, or SYNC's */
const bpmNow = d => d.bpm ? (d.bpm * (1 + rateNow(d))).toFixed(1) : "";            /* as it plays */
const beatsText = b => b >= 1 ? String(Math.round(b * 100) / 100) : "1/" + Math.round(1 / b);
const fxNow = () => (D.S && D.S.fx) || {};
const fxLine = () => { const x = fxNow(); return x.kind ? x.kind + ", " + beatsText(x.beats) + (x.beats === 1 ? " beat, " : " beats, ") + Math.round(x.wet * 100) + "% wet" : ""; };
const pitchLine = d => (d.synced ? "SYNC " : "") + pct(rateNow(d)) + (d.synced ? "" : ", range " + (d.range || 8) + "%");
const tms = s => { const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };
const loopLine = d => { if (d.loop_in == null || d.loop_out == null) return d.loop_in != null ? "loop in is set: OUT closes it" : "";
  const len = d.loop_out - d.loop_in, beats = d.bpm ? len * d.bpm / 60 : 0, whole = beats && Math.abs(beats - Math.round(beats * 32) / 32) < 0.002;
  const b = !whole ? "" : beats >= 1 ? beats + (beats === 1 ? " beat, " : " beats, ") : "1/" + Math.round(1 / beats) + " beat, ";
  return "loop " + (d.loop_on ? "on: " : "off: ") + b + len.toFixed(len < 1 ? 3 : 2) + " s"; };
/* a pad, tapped: set here if empty, else go there (a held pad is the Numark's to do); clearing is a tap on CLEAR first */
const Pads = { clear: [false, false],
  tap(n, i) { if (this.clear[n - 1]) { this.clear[n - 1] = false; return ask("hotclear " + n + " " + i); }
    ask("hot " + n + " " + i + " 1"); return ask("hot " + n + " " + i + " 0"); } };
const cue = n => { ask("cue " + n + " 1"); ask("cue " + n + " 0"); };      /* a tap: to the cue point, or the cue point set here */
const start = () => post("/select", { module: "dj" }).then(full);

/* The library: the music folder as folders and files, the same cursor as the Numark's browse
   knob (the engine's), and a second list for the box's SD card. `dir` and the card's folder are
   view choices; the cursor is the engine's. */
const L = { dir: "", card: null, pick: null, seen: null, sure: false,
  rows() {
    if (this.card) { const c = this.card, out = c.path ? [{ kind: "up", name: "..", note: "up" }] : [];
      for (const n of c.dirs || []) out.push({ kind: "dir", name: n, path: (c.path ? c.path + "/" : "") + n });
      for (const n of c.files || []) out.push({ kind: "file", name: n, path: (c.path ? c.path + "/" : "") + n });
      return out; }
    const out = this.dir ? [{ kind: "up", name: "..", note: "up" }] : [], dirs = new Set(), files = [];
    for (const f of D.files) { if (!f.startsWith(this.dir)) continue; const rest = f.slice(this.dir.length), k = rest.indexOf("/");
      if (k >= 0) dirs.add(rest.slice(0, k)); else files.push(f); }
    for (const n of [...dirs].sort()) out.push({ kind: "dir", name: n, path: this.dir + n + "/" });
    for (const f of files) { const on = [0, 1].filter(i => deck(i).file === f).map(i => i + 1);
      out.push({ kind: "file", name: f.slice(this.dir.length).replace(/\.[^.]+$/, ""), path: f, note: on.length ? "on deck " + on.join(" and ") : "" }); }
    return out; },
  cursor() { return (D.S && D.S.browse && D.S.browse.file) || null; },
  follow() { const c = this.cursor(); if (c === this.seen) return false; this.seen = c; this.sure = false;      /* the knob moved it: show where it is */
    if (c && !this.card) this.dir = c.includes("/") ? c.slice(0, c.lastIndexOf("/") + 1) : ""; return true; },
  where() { return this.card ? "box SD card" + (this.card.path ? " / " + this.card.path.split("/").join(" / ") : "") : "music" + (this.dir ? " / " + this.dir.slice(0, -1).split("/").join(" / ") : ""); },
  count() { const r = this.rows().filter(x => x.kind === "file").length; return r + (r === 1 ? " track" : " tracks"); },
  async openCard(path) { try { const r = await fetch("/decks/card?path=" + encodeURIComponent(path || "")), j = await r.json();
      if (j.error) return j.error; this.card = j; this.pick = null; return ""; } catch (e) { return "the box isn't answering"; } },
  tap(r) { this.sure = false;
    if (this.card) { if (r.kind === "up") return this.openCard(this.card.path.includes("/") ? this.card.path.slice(0, this.card.path.lastIndexOf("/")) : "");
      this.pick = r; return ""; }
    if (r.kind === "up") { const d = this.dir.slice(0, -1); this.dir = d.includes("/") ? d.slice(0, d.lastIndexOf("/") + 1) : ""; return ""; }
    if (r.kind === "dir") { this.dir = r.path; return ""; }
    return ask("at", { file: r.path }).then(j => j.error || ""); },
  copyLine() { const c = D.copy; if (!c) return "";
    return c.running ? "copying " + c.name + ": " + c.done + " of " + c.total : c.error ? "copying " + c.name + " stopped: " + c.error + " (" + c.done + " of " + c.total + " done)" : ""; } };

/* ---- the 480x320 touch screen (?small). DECKS: the two decks. LIB: the music folder, or the
   box's SD card. MIX: where the Numark's knobs stand, and the levels (read only: its knobs are
   absolute, a value dragged here would disagree with the knob). Frame and parts: small.js. ---- */
function small() {
  const el = Small.el, WAVE = 138;
  let tab = "decks", U = {}, note = "", noteBad = false, noteTill = 0, said = -1, vuAt = 0, pd = 1;
