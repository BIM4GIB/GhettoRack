<style>

.tb.play{color:var(--green);border-color:var(--green);box-shadow:0 0 14px #35d05a88, inset 0 0 10px #35d05a44}
.tb.rec{color:#7a2a25}
.big{font-family:var(--mono);font-size:30px;font-weight:600}.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.stat{display:flex;flex-direction:column;margin:0 6px}
.beats{display:flex;gap:6px}.beats i{width:16px;height:16px;border-radius:50%;background:var(--off)}.beats i.on{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.led{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.led::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

.sp{flex:1}

.tab.on{color:#c8f5d3;border:1px solid var(--green);box-shadow:0 0 10px #35d05a55}
/* perform */
.main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px 18px;min-height:0}
.strips{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;min-height:0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-rows:auto auto auto 1fr auto auto;padding:6px 4px;gap:5px;min-height:0;justify-items:center}
.st.sel{border-color:var(--yellow);box-shadow:0 0 12px #ffb83355}
.nm{font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}.nm b{display:block;font-family:var(--mono);color:var(--dim);font-size:11px}

.slot{width:6px;background:#050607;border-radius:3px;height:100%;border:1px solid #1c1f22}
.cap{position:absolute;left:50%;transform:translateX(-50%);width:34px;height:18px;border-radius:4px;background:linear-gradient(#e6e9eb,#9aa0a6);border:1px solid #555;box-shadow:0 2px 4px #000}
.cap::after{content:"";position:absolute;left:3px;right:3px;top:8px;height:2px;background:#222}
.mt{display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start}
.mt i{width:8px;flex:1;border-radius:1px;background:var(--off);max-height:14px}
.mt i.g{background:var(--green);box-shadow:0 0 5px var(--green)}.mt i.y{background:var(--yellow);box-shadow:0 0 5px var(--yellow)}.mt i.r{background:var(--red);box-shadow:0 0 5px var(--red)}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:100%}.steps i{height:7px;border-radius:2px;background:var(--off)}
.steps i.on{background:var(--red);box-shadow:0 0 4px var(--red)}.steps i.ph{background:var(--yellow);box-shadow:0 0 5px var(--yellow)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.b{height:30px;border-radius:5px;background:#1d2024;border:1px solid #33373c;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#5d646b}

.side{display:grid;grid-template-rows:auto auto 1fr;gap:12px;min-height:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.box h3{margin:0 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

.pad.next{color:var(--green);border:1px dashed var(--green)}
.fx{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.fx .pad{height:44px;color:#8a6a1f;border-color:#4d3a10}
.fx .pad.on{color:#111;background:var(--yellow);box-shadow:0 0 14px var(--yellow)}
.mk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;justify-items:center}
/* sound view */
.sound{display:grid;grid-template-rows:auto 230px 1fr 1fr;gap:12px;padding:12px 18px;min-height:0}
.row8{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;min-height:0}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.cell .v{font-family:var(--mono);font-size:22px}.cell .n{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.wave{background:#060708;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.wave svg{width:100%;height:100%;display:block}
.wave .tag{position:absolute;top:8px;font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:4px;background:#000a}
.cell svg{max-height:62%}
.hd{display:flex;align-items:center;gap:14px}.hd .big{font-size:24px}
.seg{display:flex;gap:6px}.seg span{padding:6px 12px;border-radius:6px;border:1px solid #33373c;color:#5d646b;font-size:13px}
.seg span.on{color:var(--amber);border-color:var(--amber);box-shadow:0 0 9px #ff9a1f77}

.sub{display:flex;gap:6px;align-items:center}
.sub span{padding:6px 14px;border-radius:6px;border:1px solid #33373c;color:#5d646b;font-size:13px}
.sub span.on{color:var(--amber);border-color:var(--amber);box-shadow:0 0 9px #ff9a1f77}
.v{display:grid;gap:12px;padding:12px 18px;min-height:0}
.hdr{display:flex;align-items:center;gap:14px;min-height:36px}
.hdr .big{font-size:22px}
/* drum grid */
.grid{display:grid;grid-template-columns:150px 92px repeat(16,1fr);gap:4px;min-height:0;align-content:stretch}
.grid .tn{display:flex;align-items:center;gap:8px;font-size:14px;padding-left:8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.grid .tn b{font-family:var(--mono);color:var(--dim);width:18px}
.grid .tn.sel{border-color:var(--yellow);box-shadow:0 0 10px #ffb83355}

.sc.q{background:#202428}

/* one track */
.bigsteps{display:grid;grid-template-columns:repeat(16,1fr);gap:8px;min-height:0}
.bs{border-radius:10px;background:#1a1d20;border:1px solid #2a2d31;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;font-family:var(--mono);color:var(--dim);font-size:14px;gap:6px}
.bs.q{background:#202428}.bs.on{border-color:var(--green);box-shadow:inset 0 0 26px #35d05a66;color:var(--green)}

.bs.ph{outline:3px solid var(--yellow);outline-offset:2px}
.bs .nt{font-size:22px;color:var(--text)}.bs .sl{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--yellow);color:#111}
.roll{display:grid;grid-template-columns:54px repeat(16,1fr);grid-auto-rows:1fr;gap:2px;min-height:0;background:#060708;border:1px solid var(--line);border-radius:10px;padding:8px}
.roll .k{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.roll .k.bk{background:#000;color:#555;border-radius:3px}
.roll .c{border-radius:3px;background:#14171a}.roll .c.q{background:#191d21}
.roll .c.n{background:var(--green);box-shadow:0 0 8px #35d05a99}.roll .c.a{background:var(--red);box-shadow:0 0 8px #ff4b3e99}
.roll .c.s{border-right:8px solid var(--yellow)}
/* mixer */
.mx{display:grid;grid-template-columns:repeat(16,1fr) 150px;gap:6px;min-height:0}
/* panels */
.wave{background:#060708;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;min-height:0}
.wave svg{width:100%;height:100%;display:block}
.wave .tag{position:absolute;top:8px;font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:4px;background:#000a}
.row8{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;min-height:0}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.cell svg{max-height:62%}
.cell .val{font-family:var(--mono);font-size:22px}.cell .n{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-auto-rows:1fr;min-height:0}
.li{display:grid;grid-template-columns:28px 260px 1fr 90px 150px;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid #202327;min-height:0}
.li.sel{background:#1b2a1f;outline:1px solid var(--green)}
.li .ic{color:var(--amber)}.li .nm2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .d{font-family:var(--mono);color:var(--dim);font-size:12px}
.li svg{height:70%;width:100%}
.act{display:flex;gap:6px;justify-content:flex-end}.act .b{padding:0 10px;height:28px}
.pg{display:grid;gap:6px;min-height:0}
.bigpad{border-radius:10px;background:#1d2024;border:1px solid #33373c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;color:#5d646b;gap:4px;min-height:0}

.log{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6;overflow:hidden}

/* ---- the real page (apcbox.js): buttons instead of the mock's divs, live states ---- */
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.b,button.pad,button.bigpad,button.sc,button.bs,button.c,button.tab,button.tb{appearance:none;margin:0}
button.tab{background:none;border:1px solid transparent}
.tb.sm{font-size:13px;min-width:44px;height:36px;padding:0 10px;color:var(--text)}
.tb.rec.on{color:var(--red);border-color:var(--red);box-shadow:0 0 14px #ff4b3e88, inset 0 0 10px #ff4b3e44}
.tb.sm.on{color:var(--amber);border-color:var(--amber);box-shadow:0 0 9px #ff9a1f77}

.led.bad::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.led.bad,.led.warn{color:var(--text)}

/* ---- any screen: the app is absolutely sized and scaled by fit() in apcbox.js ---- */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
.app{position:absolute;left:0;top:0;height:auto;transform-origin:0 0}
body.phone .app{grid-template-rows:92px minmax(0,1fr) 58px}
.app{grid-template-rows:64px minmax(0,1fr) 60px}
#view{min-height:0;min-width:0;overflow:hidden}
/* the view bar reads as buttons: this is how you get around */
.tabs{gap:10px}
button.tab{border:1px solid #3a3f45;background:#1d2024;color:#c3c8cd;height:44px;font-size:16px;font-weight:600}

.sm-pat .s-ops{display:flex;gap:4px;align-items:stretch}.sm-pat .s-ops .b{width:62px}.sm-pat .s-hint{flex:1;align-self:center;text-align:right;color:var(--yellow);white-space:nowrap;overflow:hidden}

.sm-pat.zoom .s-pg{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:4px}.sm-pat.zoom .s-pp{font-size:16px}
.sm-pat.zoom .s-fx{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}.sm-pat.zoom .s-fx .bigpad{font-size:12px}

.sm-lib .s-lt{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}body.small .b.s-tg.on{color:var(--text);border-color:var(--yellow)}

.sm-lib .s-li{appearance:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;color:var(--dim);font:inherit;font-size:12px;border-radius:3px;padding:0 6px;min-width:0;text-align:left}
.sm-lib .s-li.on{background:var(--off);border-color:var(--yellow);color:var(--text)}.sm-lib .s-li.s-dir{color:var(--amber)}
.sm-lib .s-li .s-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sm-lib .s-li .s-d{font-size:10px;color:var(--dim);white-space:nowrap}.sm-lib .s-li canvas{width:110px;height:28px}
.sm-lib .s-ls{display:grid;grid-template-rows:repeat(3,1fr) 34px;gap:4px}

.sm-lib .s-msg{grid-column:1 / -1;max-width:none;color:var(--dim)}

.sm-sys .s-kv{display:grid;grid-template-columns:86px 1fr;gap:3px 6px}.sm-sys .s-k{color:var(--dim)}.sm-sys .s-v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-sys .s-v.bad{color:var(--red)}.sm-sys .s-v.warn{color:var(--yellow)}
.sm-sys .s-log{white-space:pre;overflow:hidden;color:var(--dim);border-top:1px solid var(--line);padding-top:3px;font-size:10px}

</style>

<body>
<div class="app">
<div class="top"></div>
<div id="view"></div>
<div class="tabs" id="tabs"></div>
</div>
<script>
/* ApcBox on the T95: full-screen views driven by the Daisy's report lines
   (SSE /events) and POST /do (control protocol 4, firmware v13.9+). Works
   with no APC40. The look and the view list: t95/ui/VIEWS.md. This file is
   inlined into apcbox.html by t95/ui/build.py. */
"use strict";
const AM = "#ff9a1f", GR = "#35d05a", BL = "#4aa3ff";
const FXN = ["rpt 1/4", "rpt 1/8", "rpt 1/16", "rpt 1/32", "tape stop", "reverse", "crush", "gate"];
const DIV = ["1/16", "1/8", "1/8 dot", "1/4", "1/4 dot", "1/2"];
const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const Q = new URLSearchParams(location.search);
const tv = Q.has("tv");
/* ?small: the 480x320 touch screen on the companion box's own header (a Pi). Its views are
   further down, under "the small layout". */
const SMALL = Q.has("small"), SMALL_W = 480, SMALL_H = 320, VIEW_KEY = SMALL ? "apcbox-small-view" : "apcbox-view";
/* One layout drawn for a 1920 px wide screen (TV, Mac, iPad on its side) and one
   for a 390 px wide phone held upright (also an iPad held upright). Whichever
   fits is scaled to the window, so nothing is ever cut off and the view bar is
   always on screen. The height comes from the visible area, which on iOS is
   smaller than "100vh" while Safari's bars show. */
const WIDE_W = 1920, WIDE_MIN_H = 900, TALL_W = 390, TALL_MIN_H = 700, SHORT_W = 844, SHORT_MIN_H = 330;
let PHONE = false, SHORT = false, SCALE = 1;   /* PHONE: upright; SHORT: a phone on its side; neither: wide */
const sz = (wide, tall, short) => SHORT ? short : PHONE ? tall : wide;
function fit() {
  const vv = window.visualViewport, w = Math.round(vv ? vv.width : innerWidth), h = Math.round(vv ? vv.height : innerHeight);
  if (SMALL) {   /* drawn 1:1; Chromium's window is never under 500 px wide, the panel shows the left 480 */
    let s = Math.min(w / SMALL_W, h / SMALL_H); if (s > 0.98 && s < 1.1) s = 1;
    const app = document.querySelector(".app");
    app.style.width = SMALL_W + "px"; app.style.height = SMALL_H + "px"; app.style.transform = "scale(" + s + ")";
    SCALE = s; document.body.classList.add("small");
    return false;
  }
  const tall = h > w * 1.1, short = !tall && h < 520 && !tv;
  const dw = tall ? TALL_W : short ? SHORT_W : WIDE_W, dh = tall ? TALL_MIN_H : short ? SHORT_MIN_H : WIDE_MIN_H;
  let s = w / dw;
  if (h / s < dh) s = h / dh;
  const app = document.querySelector(".app");
  app.style.width = (w / s) + "px"; app.style.height = (h / s) + "px"; app.style.transform = "scale(" + s + ")";
  SCALE = s;
  const was = (PHONE ? 1 : 0) + (SHORT ? 2 : 0);
  PHONE = tall; SHORT = short;
  document.body.classList.toggle("phone", PHONE);
  document.body.classList.toggle("short", SHORT);
  return was !== (PHONE ? 1 : 0) + (SHORT ? 2 : 0);
}
fit();
document.body.classList.toggle("tv", tv);

/* ---------- state, from the Daisy ---------- */
const st = {
  S: null, playing: 0, step: 0, pat: 0, qpat: -1, rec: 0, bpm: 1200, metro: 0, sel: 0, mute: 0, solo: 0, synth: 0,
  loading: 0, fx: 0, lrec: 0, lrecT: 0, lrecBars: 0, inPeak: 0, mon: 0, cpu: 0, apc: 0, sd: 0, set: -1, dirty: 0,
  grid: "0".repeat(256), gridPat: -1, patmask: 0n, meters: new Uint8Array(18), glob: new Uint8Array(10),
  tr: Array.from({ length: 16 }, () => ({ v: new Uint8Array(13), name: "", acid: new Uint8Array(8), notes: null, notesPat: -1, wave: null })),
  log: [], daisy: false, ctl: 0, bridge: null, ver: 0,
  lp: { len: 0, count: 0, qrec: 0, qpat: 0, qmute: 0, gain: 64, mode: 0, undo: 0, redo: 0, qfx: 1 },
  sets: Array.from({ length: 8 }, () => ({ exists: false })), trans: 0, transName: "", setOp: 0, kits: [], kitPg: [-1, -1], xfer: null, caps: {},
  ov: { mask: 0, rev: 0 },   // overload (OV line, report 19): 303 tracks left out (a bit each), reverb out
  sm: null,       // loop memory (SM line, report 18), in samples: { total, free, largest, claims, slot, take }
};
const patName = p => "ABCDEFGH"[p >> 3] + (1 + (p & 7));
/* overload: how many 303 voices the Daisy is leaving out, in words */
const ovOut = t => (st.ov.mask >> t & 1) === 1;
function ovText() { let out = 0, all = 0; for (let t = 0; t < 16; t++) { out += st.ov.mask >> t & 1; all += st.synth >> t & 1; }
  return st.ov.rev ? `OVERLOAD: all ${all} 303s + reverb out` : `OVERLOAD: ${out} of ${all} 303s out`; }
const typeOf = t => (st.synth >> t & 1) ? "303" : st.tr[t].name.startsWith("[loop") ? "loop" : "sample";
function trackName(t) {
  let n = st.tr[t].name;
  if (!n) return "-";
  if (n === "[303]") return "303";
  if (n.startsWith("[loop")) return "loop";
  if (n[0] === "[") { n = n.slice(1, -1); const i = n.indexOf(" "); return i > 0 ? n.slice(i + 1) : n; }
  return n.replace(/\.[a-z0-9]+$/i, "");
}

/* ---------- sending: coalesced, 25 times a second ---------- */
const pend = new Map(), busy = new Map();
function act(cmd, key) { pend.set(key || cmd, cmd); }
function hold(key, ms) { busy.set(key, performance.now() + (ms || 500)); }
const isBusy = key => (busy.get(key) || 0) > performance.now();
let sendErr = "";
setInterval(async () => {
  if (!pend.size) return;
  const a = [...pend.values()].slice(0, 32);
  for (const k of [...pend.keys()].slice(0, 32)) pend.delete(k);
  try {
    const r = await fetch("/do", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ a }) });
    const j = await r.json();
    sendErr = j.error || "";
  } catch (e) { sendErr = "T95 bridge not answering"; }
  topStatus();
}, 40);

/* ---------- parts ---------- */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const fmt = {
  pct: v => Math.round(v / 1.27) + "%",
  pan: v => v === 63 || v === 64 ? "C" : v < 64 ? "L" + Math.round((64 - v) / 0.64) : "R" + Math.round((v - 63) / 0.64),
  pitch: v => { const s = Math.round((v / 127 - 0.5) * 24); return (s > 0 ? "+" : "") + s + " st"; },
  decay: v => v >= 127 ? "full" : Math.round(10 * Math.pow(400, v / 127)) + " ms",
  filter: v => { const p = v / 127; return Math.abs(p - 0.5) < 0.02 ? "off" : p < 0.5 ? "LP " + Math.round((0.5 - p) * 200) : "HP " + Math.round((p - 0.5) * 200); },
  rev: v => v >= 64 ? "rev" : "fwd",
  adecay: v => Math.round(30 * Math.pow(80, v / 127)) + " ms",
  tune: v => { const s = (v === 63 || v === 64) ? 0 : (v / 127 - 0.5) * 24; return (s > 0 ? "+" : "") + s.toFixed(1) + " st"; },
  slide: v => Math.round(12 * Math.pow(25, v / 127)) + " ms",
  wave: v => v >= 64 ? "square" : "saw",
  div: v => DIV[Math.min(5, Math.floor(v / 127 * 6))],
  swing: v => Math.round(50 + v / 127 * 25) + "%",
  xf: v => { const x = (v === 63 || v === 64) ? 0.5 : v / 127; return x === 0.5 ? "A+B" : x < 0.5 ? "A" : "B"; },
};

/* A pot with a ring of 15 LEDs. mode "pan": lit from the centre. Drag up/down, wheel, arrow keys when focused. */
function Pot(o) {
  const size = o.size || 54, n = 15, r = size / 2 - 4, c = size / 2, kr = r - size / 7;
  const wrap = el("div", o.cell ? "cell" : "kn");
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.setAttribute("tabindex", "0"); svg.classList.add("pot");
  const leds = [];
  for (let i = 0; i < n; i++) {
    const a = (135 + 270 * i / (n - 1)) * Math.PI / 180, d = document.createElementNS(ns, "circle");
    d.setAttribute("cx", (c + r * Math.cos(a)).toFixed(1)); d.setAttribute("cy", (c + r * Math.sin(a)).toFixed(1)); d.setAttribute("r", size / 26);
    d.setAttribute("fill", "#23262a"); svg.appendChild(d); leds.push(d);
  }
  const knob = document.createElementNS(ns, "circle");
  knob.setAttribute("cx", c); knob.setAttribute("cy", c); knob.setAttribute("r", kr); knob.setAttribute("fill", "#2b2f34"); knob.setAttribute("stroke", "#000"); knob.setAttribute("stroke-width", 1.5);
  const line = document.createElementNS(ns, "line");
  line.setAttribute("x1", c); line.setAttribute("y1", c - kr * 0.35); line.setAttribute("x2", c); line.setAttribute("y2", c - kr * 0.92);
  line.setAttribute("stroke", "#fff"); line.setAttribute("stroke-width", Math.max(2, size / 30)); line.setAttribute("stroke-linecap", "round");
  svg.appendChild(knob); svg.appendChild(line);
  wrap.appendChild(svg);
  let valEl = null;
  if (o.cell) { valEl = el("span", "val"); wrap.appendChild(valEl); wrap.appendChild(el("span", "n", o.label)); }
  else if (o.label) wrap.appendChild(document.createTextNode(o.label));
  let val = -1, lit = new Array(n).fill(false), txt = "";
  function set(v) {
    if (v === val) return;
    val = v;
    const p = v / 127;
    for (let i = 0; i < n; i++) {
      const q = i / (n - 1);
      const on = o.mode === "pan" ? (p >= 0.5 ? q >= 0.499 && q <= p + 0.001 : q <= 0.501 && q >= p - 0.001) : (v > 0 || o.mode !== "vol0") && q <= p + 0.001;
      if (on !== lit[i]) { lit[i] = on; leds[i].setAttribute("fill", on ? o.color : "#23262a"); }
    }
    line.setAttribute("transform", `rotate(${-135 + 270 * p} ${c} ${c})`);
    if (valEl && o.fmt) { const t = o.fmt(v); if (t !== txt) valEl.textContent = txt = t; }
  }
  function change(v) { v = Math.max(0, Math.min(127, Math.round(v))); if (v === val) return; set(v); o.onChange(v); }
  let drag = null;
  svg.addEventListener("pointerdown", e => { drag = { y: e.clientY, v: val }; svg.setPointerCapture(e.pointerId); svg.focus(); e.preventDefault(); });
  svg.addEventListener("pointermove", e => { if (drag) change(drag.v + (drag.y - e.clientY) / Math.max(0.5, SCALE) * (e.shiftKey ? 0.2 : 0.8)); });
  const end = () => { drag = null; };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  svg.addEventListener("dblclick", () => { if (o.reset !== undefined) change(o.reset); });
  svg.addEventListener("wheel", e => { change(val + (e.deltaY < 0 ? 2 : -2)); e.preventDefault(); }, { passive: false });
  svg.addEventListener("keydown", e => {
    const d = { ArrowUp: 2, ArrowDown: -2, PageUp: 10, PageDown: -10 }[e.key];
    if (d) { change(val + d); e.preventDefault(); e.stopPropagation(); }
  });
  svg.style.touchAction = "none";
  return { el: wrap, set, step: d => change(val + d), get dragging() { return !!drag; } };
}

/* LED meter: n segments, level 0-255 linear peak shown on a 48 dB scale */
function Meter(n) {
  const m = el("div", "mt"), seg = [];
  for (let i = 0; i < (n || 14); i++) { const s = el("i"); m.appendChild(s); seg.push(s); }
  let cur = 0;
  return { el: m, set(p) {
    const db = p > 0 ? 20 * Math.log10(p / 255) : -99, k = Math.max(0, Math.min(seg.length, Math.round((db + 48) / 48 * seg.length)));
    if (k === cur) return;
    for (let i = Math.min(k, cur); i < Math.max(k, cur); i++) seg[i].className = i < k ? (i >= seg.length - 2 ? "r" : i >= seg.length - 5 ? "y" : "g") : "";
    cur = k;
  } };
}

/* Fader with a meter each side */
function Fader(onChange) {
  const f = el("div", "fd"), m1 = Meter(), m2 = Meter(), slot = el("div", "slot"), cap = el("div", "cap");
  f.appendChild(m1.el); f.appendChild(slot); f.appendChild(m2.el); f.appendChild(cap);
  let val = -1, drag = false;
  function set(v) { if (v === val) return; val = v; cap.style.top = ((1 - v / 127) * 88) + "%"; }
  function at(e) { const r = f.getBoundingClientRect(); const v = Math.max(0, Math.min(127, Math.round((1 - (e.clientY - r.top - 9 * SCALE) / (r.height - 18 * SCALE)) * 127))); if (v !== val) { set(v); onChange(v); } }
  f.addEventListener("pointerdown", e => { drag = true; f.setPointerCapture(e.pointerId); at(e); e.preventDefault(); });
  f.addEventListener("pointermove", e => { if (drag) at(e); });
  const end = () => { drag = false; };
  f.addEventListener("pointerup", end); f.addEventListener("pointercancel", end);
  f.style.touchAction = "none";
  return { el: f, set, meter(p) { m1.set(p); m2.set(p); }, meters(a, b) { m1.set(a); m2.set(b); }, get dragging() { return drag; } };
}

function Btn(cls, text, onTap) {
  const b = el("button", "b " + cls, text);
  b.onclick = onTap;
  let on = null;
  return { el: b, set(v, blink) { const k = (v ? 1 : 0) + (blink ? 2 : 0); if (k === on) return; on = k; b.classList.toggle("on", !!v); b.classList.toggle("blink", !!blink); } };
}

/* One of a few: [[value, label]...]. get() says which is on, pick(value) on a tap */
function Seg(opts, get, pick) {
  const d = el("div", "seg"), sp = opts.map(([v, n]) => { const x = el("span", "", n); x.onclick = () => { pick(v); upd(); }; d.appendChild(x); return [v, x]; });
  function upd() { const c = get(); for (const [v, x] of sp) x.classList.toggle("on", v === c); }
  upd();
  return { el: d, upd };
}
/* A looper / quantise setting: shown at once, sent, and not overwritten by the Daisy's answer for a moment */
const lpAct = (k, v, cmd) => { st.lp[k] = v; hold("lp." + k); act(cmd, "lp." + k); };
const LEN_OPTS = [[0, "free"], [1, "1"], [2, "2"], [4, "4"], [8, "8"]];
/* Loop memory. A bar in samples, as the Daisy counts it, and seconds for the eye */
const barSamples = () => Math.floor(115200000 / st.bpm);
const smSec = n => Math.round(n / 48000);
/* A take of the chosen length on track t that the Daisy would refuse: the words for it ("" = there is room,
   or nothing is known). Same sums as LooperStart in daisy/box.cpp; over a track's own long loop the Daisy decides. */
function loopNoRoom(t) {
  const m = st.sm, bars = st.lp.len; if (!m || !m.total || !bars || typeOf(t) === "loop") return "";
  const need = bars * barSamples(); if (need + Math.floor(need / 64) <= m.slot) return "";
  const want = Math.ceil((need + Math.floor(need / 16)) / 16384) * 16384; if (want <= m.largest) return "";
  return `no room: ${bars} bars at ${Math.round(st.bpm / 10)} BPM (${smSec(need)} s, longest free ${smSec(m.largest)} s)`;
}
/* What the looper is doing on track t, in words ("" = nothing) */
function lrecText(t) {
  if (!st.lrec || st.lrecT !== t) return "";
  const on = st.lp.qrec ? "beat" : "bar", m = st.lp.mode;
  if (st.lrec === 1) return m === 2 ? "sample: waiting for sound" : (m === 1 ? "overdub" : "loop") + " armed: starts on the next " + on + (st.lp.count && !m ? " (count-in)" : "");
  if (m === 2) return "● recording a sample: STOP when done";
  const room = !m && !st.lp.len && st.sm && st.sm.take ? Math.floor(st.sm.take / barSamples()) : 0;
  return "● " + (m === 1 ? "overdubbing" : "recording") + ": bar " + (st.lrecBars + 1) + (st.lp.len ? " of " + st.lp.len : room ? ", room for " + room : "");
}
/* A button that's on while it's held (roll) */
function HoldBtn(cls, text, down, up) {
  const b = el("button", "b " + cls, text); let held = false;
  const d = e => { held = true; b.classList.add("on"); down(); try { b.setPointerCapture(e.pointerId); } catch (x) { } e.preventDefault(); }, u = () => { if (!held) return; held = false; b.classList.remove("on"); up(); };
  b.addEventListener("pointerdown", d); b.addEventListener("pointerup", u); b.addEventListener("pointercancel", u);
  b.style.touchAction = "none";
  return b;
}

/* Waveform from a Z line's 96 peaks, with optional markers [pos 0..1, colour] */
function Wave() {
  const w = el("div", "wave"), cv = el("canvas"), tag = el("span", "tag");
  tag.style.left = "10px"; tag.style.color = "var(--dim)";
  w.appendChild(cv); w.appendChild(tag);
  let last = "";
  function draw(wave, marks, color, text) {
    const key = (wave ? wave.key : "-") + JSON.stringify(marks || []) + color + cv.clientWidth + "x" + cv.clientHeight;
    tag.textContent = text || "";
    if (key === last) return;
    last = key;
    const W = cv.width = Math.max(50, cv.clientWidth * devicePixelRatio), H = cv.height = Math.max(20, cv.clientHeight * devicePixelRatio);
    const g = cv.getContext("2d");
    g.clearRect(0, 0, W, H);
    g.fillStyle = "#1c1f22"; g.fillRect(0, H / 2, W, 1);
    if (wave && wave.pts) {
      const n = wave.pts.length, bw = W / n;
      let top = 1; for (const p of wave.pts) top = Math.max(top, p);
      g.fillStyle = color || GR;
      for (let i = 0; i < n; i++) { const hh = Math.max(1, Math.pow(wave.pts[i] / top, 0.6) * H * 0.46); /* quiet tails stay visible */ g.fillRect(i * bw, H / 2 - hh, Math.max(1, bw * 0.72), 2 * hh); }
    }
    for (const m of marks || []) { g.fillStyle = m[1]; g.fillRect(Math.min(W - 3, m[0] * W), 0, 3 * devicePixelRatio, H); }
  }
  return { el: w, draw };
}

/* ---------- listen: the Daisy's sound in this browser ----------
   /audio.pcm is raw 16-bit 48 kHz stereo from the bridge. It goes into a ring
   buffer and out through Web Audio (ScriptProcessor: works without HTTPS and
   on iOS). About 0.15 s is kept buffered; if the network delivers late it
   refills, if it piles up the oldest is skipped, so it stays close to live. */
const Listen = {
  on: false, state: "off", err: "", ctx: null, node: null, abort: null, keep: null,
  ring: [new Float32Array(48000), new Float32Array(48000)], w: 0, r: 0, filled: false, played: 0, got: 0, under: 0,
  buffered() { return (this.w - this.r + 48000) % 48000; },
  async start() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.err = "this browser has no Web Audio"; this.state = "error"; return listenBtn(); }
    this.on = true; this.state = "connecting"; this.err = ""; listenBtn();
    try {
      /* iOS: a playing <audio> element makes Web Audio ignore the silent switch */
      this.keep = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA");
      this.keep.loop = true; this.keep.play().catch(() => { });
      this.ctx = new AC({ latencyHint: "interactive" });
      await this.ctx.resume();
      this.w = this.r = 0; this.filled = false; this.rpos = 0;
      const ratio = 48000 / this.ctx.sampleRate, target = 48000 * 0.15;

    this.say(x.state === "failed" ? x.name + ": " + (x.error || "failed") : x.state === "done" ? x.name + " is in track " + x.track + (x.cut ? " (cut to fit)" : "") + (x.kb_per_s ? " · " + x.kb_per_s + " kB/s" : "")
      : x.name + " → track " + x.track + ": " + x.state + (x.state === "sending" ? " " + pct + "%" : ""), x.state === "failed"); },
};

V.sm_sys = {
  build() {
    view.className = "sm sm-sys";
    this.kv = el("div", "s-kv"); this.log = el("div", "s-log");
    const bt = el("div", "s-bt");
    [["MODULES", () => { location.href = "/"; }], ["SETTINGS", () => { location.href = "/settings"; }], ["RELOAD", () => location.reload()]].forEach(([n, f]) => { const b = el("button", "b", n); b.onclick = f; bt.appendChild(b); });
    view.append(this.kv, this.log, bt);
    this.key = ""; this.L();
  },
  B() {
    const b = st.bridge || {}, pg = b.ping_ms || {}, sm = st.sm, secs = n => (n / 48000).toFixed(0) + " s";
    const rows = [
      ["Daisy", st.daisy ? "connected" + (b.port ? "  " + b.port : "") : "not connected", st.daisy ? "" : "bad"],
      ["firmware", (st.fw || b.firmware || "?") + "   report " + (st.ver || "?") + "   control " + (st.ctl || "?"), st.ver && st.ver !== REPORT_VERSION ? "bad" : ""],
      ["link", pg.count ? "ping " + pg.avg + " ms avg, " + pg.max + " max, " + (pg.lost || 0) + " lost" : "no ping yet", pg.lost ? "warn" : ""],
      ["cpu", Math.round(st.cpu / 10) + "%" + (st.ov.mask || st.ov.rev ? "   " + ovText() : ""), st.ov.mask || st.ov.rev ? "bad" : ""],
      ["loop memory", sm ? secs(sm.free) + " free of " + secs(sm.total) + ", longest piece " + secs(sm.largest) : "-", ""],
      ["controllers", (b.controllers || []).map(c => c.name).join(", ") || (st.apc ? "APC40 on the Daisy" : "none"), ""],
      ["card / set", (st.sd ? "card in" : "no card") + "   " + (st.set < 0 ? "set not saved" : "set " + (st.set + 1)) + (st.dirty ? " *" : ""), st.sd ? "" : "warn"],
      ["this screen", innerWidth + " x " + innerHeight + "   " + location.host, ""],
    ];
    const key = JSON.stringify(rows); if (key === this.key) return; this.key = key;
    this.kv.textContent = "";
    for (const [k, v, c] of rows) this.kv.append(el("span", "s-k", k), el("span", "s-v " + c, v));
  },
  S() { smTopS(); this.B(); },
  L() { this.log.textContent = st.log.slice(-4).join("\n"); },
};

/* A touch acts when the finger lands, not when it lifts: a press on this resistive panel lasts
   0.2 to 0.3 s, and a click only comes at its end. The click that follows is swallowed. */
if (SMALL) { let fired = null; const hit = e => e.target.closest ? e.target.closest("button, i.s-c") : null;
  document.addEventListener("pointerdown", e => { const t = hit(e); fired = null; if (!t || !t.onclick || t.disabled || e.pointerType === "mouse") return; fired = t; t.onclick(e); }, true);
  document.addEventListener("click", e => { if (fired && e.isTrusted) { e.stopPropagation(); e.preventDefault(); } fired = null; }, true); }

/* ---------- shell ---------- */
const TABS = SMALL ? SM_TABS : [["perform", "Perform", "Perf"], ["steps", "Steps", "Steps"], ["mixer", "Mixer", "Mix"], ["sound", "Sound", "Sound"], ["samples", "Samples", "Smpl"], ["patterns", "Patterns", "Patt"], ["fx", "FX", "FX"], ["system", "System", "Sys"]];
function buildTabs() {
  if (SMALL) return smTabs();
  const tb = document.getElementById("tabs"); tb.textContent = "";
  TABS.forEach((t, i) => { const b = el("button", "tab" + (t[0] === (curName === "map" ? "system" : curName) ? " on" : "")); if (!PHONE && !SHORT) b.appendChild(el("kbd", "", String(i + 1))); b.appendChild(document.createTextNode(t[1])); b.onclick = () => show(t[0]); tb.appendChild(b); });
  if (!PHONE && !SHORT) tb.append(el("span", "sp"), el("span", "lbl", "1-8 views · ◀ ▶ track · space play"));
}
function show(name) {
  if (!V[name] || SMALL !== name.startsWith("sm_")) name = SMALL ? "sm_steps" : "perform";
  curName = name; cur = V[name];
  try { localStorage.setItem(VIEW_KEY, name); } catch (e) { }
  view.textContent = ""; view.removeAttribute("style"); view.className = "";
  cur.build();
  for (const k of ["N", "T", "A", "M", "G", "Q", "O", "Z", "H", "J", "K", "X", "P", "S"]) if (cur[k]) cur[k]();
  buildTabs();
}
function call(k, arg) { if (cur && cur[k]) cur[k](arg); }

/* ---------- lines from the Daisy ---------- */
function line(l) {
  const sp = l.indexOf(" "), type = sp < 0 ? l : l.slice(0, sp), rest = sp < 0 ? "" : l.slice(sp + 1);
  switch (type) {
    case "S": {
      const f = rest.split(" ").map(Number); if (f.length < 56) return;
      st.playing = f[0]; st.step = f[1]; st.pat = f[2]; st.qpat = f[3]; st.rec = f[4]; if (!isBusy("bpm")) st.bpm = f[5]; st.metro = f[6];
      if (!isBusy("sel")) st.sel = f[7];
      st.cpu = f[11]; st.sd = f[13]; st.apc = f[14]; st.fx = f[16] | f[17]; st.mute = f[19]; st.solo = f[20]; st.loading = f[21]; st.synth = f[37];
      st.lrec = f[47]; st.lrecT = f[48]; st.lrecBars = f[49]; st.inPeak = f[50]; st.mon = f[51]; st.set = f[53]; st.dirty = f[54]; st.setOp = f[55];
      topS(); topStatus(); call("S"); break;
    }
    case "G": { const i = rest.indexOf(" "); const p = +rest.slice(0, i); if (isBusy("G") && p === st.gridPat) break; st.gridPat = p; st.grid = rest.slice(i + 1); call("G"); break; }
    case "T": { const f = rest.split(" ").map(Number), t = f[0]; if (!(t >= 0 && t < 16)) break; for (let i = 0; i < 13; i++) if (!isBusy("k" + t + "." + i)) st.tr[t].v[i] = f[i + 1]; call("T", t); break; }
    case "N": { const i = rest.indexOf(" "), t = +rest.slice(0, i); if (t >= 0 && t < 16) { st.tr[t].name = rest.slice(i + 1); call("N", t); } break; }
    case "A": { const f = rest.split(" ").map(Number), t = f[0]; if (!(t >= 0 && t < 16)) break; for (let i = 0; i < 8; i++) if (!isBusy("a" + t + "." + i)) st.tr[t].acid[i] = f[i + 1]; call("A", t); break; }
    case "Q": { const f = rest.split(" "), t = +f[1]; if (!(t >= 0 && t < 16) || isBusy("Q" + t)) break; const n = new Uint8Array(16); for (let i = 0; i < 16; i++) n[i] = parseInt(f[2].substr(i * 2, 2), 16); st.tr[t].notes = n; st.tr[t].notesPat = +f[0]; call("Q", t); break; }
    case "M": { const f = rest.split(" ").map(Number); for (let i = 0; i < 10; i++) if (!isBusy("g" + i)) st.glob[i] = f[i]; call("M"); break; }
    case "H": { for (let i = 0; i < 18; i++) st.meters[i] = parseInt(rest.substr(i * 2, 2), 16) || 0; call("H"); break; }
    case "O": { try { st.patmask = BigInt("0x" + rest.trim()); } catch (e) { } call("O"); break; }
    case "Z": { const f = rest.split(" "), t = +f[0]; if (!(t >= 0 && t < 16)) break; const len = +f[1], rate = +f[2] || 48000; let pts = null;
      if (len && f[3] && f[3] !== "-") { pts = []; for (let i = 0; i < f[3].length; i += 2) pts.push(parseInt(f[3].substr(i, 2), 16)); }
      st.tr[t].wave = { len, rate, pts, key: rest.length + ":" + rest.slice(-40) + len }; call("Z", t); break; }
    case "J": { const f = rest.split(" "), i = +f[0]; if (!(i >= 0 && i < 8)) break;
      st.sets[i] = f[1] === "1" ? { exists: true, bpm: +f[2] / 10, samples: +f[3], loops: +f[4], synths: +f[5], name: f.slice(6).join(" ") } : { exists: false }; call("J"); break; }
    case "JT": { const i = rest.indexOf(" "); st.trans = +rest.slice(0, i); st.transName = rest.slice(i + 1); call("J"); break; }
    case "KL": { const i = rest.indexOf(" "), k = +rest.slice(0, i); if (k >= 0 && k < 64) { st.kits[k] = rest.slice(i + 1); call("K"); } break; }
    case "KP": { const f = rest.split(" ").map(Number); st.kitPg = [f[0], f[1]]; st.kitNb = f.length > 3 ? f[3] : null; if (st.kits.length > f[2]) st.kits.length = f[2]; call("K"); break; }
    case "CK": st.ext = rest[0] === "1"; topStatus(); break;
    case "MB": { const i = rest.indexOf(" "), from = +rest.slice(0, i), h = rest.slice(i + 1); if (!st.bmap) st.bmap = [];
      for (let k = 0; k * 4 + 3 < h.length; k++) st.bmap[from + k] = [parseInt(h.substr(k * 4, 2), 16), parseInt(h.substr(k * 4 + 2, 2), 16)]; call("M"); break; }
    case "MC": st.cmap = (rest.match(/../g) || []).map(x => parseInt(x, 16)); call("M"); break;
    case "LP": { const f = rest.split(" ").map(Number); if (f.length < 8) break;
      const o = { len: f[0], count: f[1], qrec: f[2], qpat: f[3], qmute: f[4], gain: f[5], mode: f[6], undo: f[7], redo: f[8] || 0, qfx: f.length > 9 ? f[9] : 0 };
      for (const k in o) if (!isBusy("lp." + k)) st.lp[k] = o[k]; call("P"); call("S"); break; }
    case "L": st.log.push(new Date().toTimeString().slice(0, 8) + "  " + rest); if (st.log.length > 200) st.log.splice(0, 100); call("L"); break;
    case "V": st.ver = +rest; topStatus(); call("B"); break;
    case "VF": st.fw = rest; break;      // the firmware's version (report 17)
    case "OV": { const f = rest.split(" ").map(Number); if (f.length < 2) break;   // overload (report 19)
      st.ov = { mask: f[0], rev: f[1] }; topStatus(); call("S"); call("B"); break; }
    case "SM": { const f = rest.split(" ").map(Number); if (f.length < 6) break;   // loop memory (report 18)
      st.sm = { total: f[0], free: f[1], largest: f[2], claims: f[3], slot: f[4], take: f[5] }; call("P"); call("B"); break; }
  }
}
const REPORT_VERSION = 19;
let es = null;
function connect() {
  es = new EventSource("/events?view=apcbox");
  es.onmessage = e => line(e.data);
  es.addEventListener("bridge", e => { try { const b = JSON.parse(e.data); st.bridge = b; st.daisy = !!b.daisy; st.ctl = b.control || 0; topStatus(); call("B"); } catch (err) { } });
  es.addEventListener("xfer", e => { try { st.xfer = JSON.parse(e.data); call("X"); } catch (err) { } });
  es.addEventListener("ir", e => { try { remote(JSON.parse(e.data).action); } catch (err) { } });
  es.onerror = () => { st.daisy = false; sendErr = "T95 bridge not answering"; topStatus(); };
  es.onopen = () => { sendErr = ""; topStatus(); };
}
setInterval(async () => { try { const b = await (await fetch("/health")).json(); st.bridge = b; st.daisy = !!b.daisy; st.ctl = b.control || 0; topStatus(); call("B"); } catch (e) { } }, 2000);

/* ---------- remote and keyboard ---------- */
function remote(a) {
  if (/^[1-8]$/.test(a)) { if (TABS[+a - 1]) show(TABS[+a - 1][0]); }
  else if (a === "left" || a === "right") sel((st.sel + (a === "right" ? 1 : 15)) % 16);
  else if (a === "up" || a === "down") { const f = document.activeElement; if (f && f.classList.contains("pot")) f.dispatchEvent(new KeyboardEvent("keydown", { key: a === "up" ? "ArrowUp" : "ArrowDown", bubbles: true })); else knobStep(a === "up" ? 3 : -3); }
  else if (a === "play" || a === "ok") act(st.playing ? "stop" : "play");
  else if (a === "stop") act("stop");
  else if (a === "next" || a === "prev") show(TABS[(TABS.findIndex(t => t[0] === curName) + (a === "next" ? 1 : TABS.length - 1)) % TABS.length][0]);
  else if (a === "home" || a === "menu" || a === "back") location.href = "/" + (tv ? "?tv=1" : "");
}
function knobStep(d) { const t = st.sel, v = Math.max(0, Math.min(127, st.tr[t].v[0] + d)); knobAct(t, 0, v); call("T", t); }   // no pot focused: the selected track's volume
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey) return;
  if (/^[1-8]$/.test(e.key)) { if (TABS[+e.key - 1]) show(TABS[+e.key - 1][0]); e.preventDefault(); }
  else if (e.key === " ") { act(st.playing ? "stop" : "play"); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { remote(e.key === "ArrowLeft" ? "left" : "right"); e.preventDefault(); }
});
fetch("/caps").then(r => r.json()).then(c => { st.caps = c; }).catch(() => { });
function refit() { if (document.activeElement && document.activeElement.tagName === "INPUT") return;   /* the keyboard is up */
  if (fit()) { buildTop(); show(curName); } else if (cur && cur.Z) cur.Z(); }
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", () => setTimeout(refit, 200));
if (window.visualViewport) visualViewport.addEventListener("resize", refit);
document.addEventListener("gesturestart", e => e.preventDefault());   /* iOS: no pinch zoom over the controls */
/* A kiosk (the TV, the small screen): the mouse pointer goes away after 5 s without a mouse moving, and comes back with it */
if (SMALL || tv) { let idle = 0; const wake = () => { document.body.classList.remove("nocursor"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("nocursor"), 5000); };
  document.addEventListener("pointermove", e => { if (e.pointerType === "mouse") wake(); }); document.addEventListener("mousedown", wake); wake(); }

buildTop();
let start = Q.get("v"); try { start = start || localStorage.getItem(VIEW_KEY); } catch (e) { }
show(start || (SMALL ? "sm_steps" : "perform"));
connect();
</script>
