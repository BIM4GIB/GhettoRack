<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhettoRack</title>
<style>
/* Same palette as daisy/ui/apcbox-ui.html */
:root {
  --bg: #0e0f10; --panel: #17191b; --line: #2a2d31; --text: #d9dcdf; --dim: #7d848c;
  --green: #35d05a; --red: #ff4b3e; --yellow: #ffb833; --off: #26292d;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
body.tv { zoom: 1.5; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #121416; }
h1 { font-size: 17px; margin: 0; letter-spacing: .08em; }
.chip { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 5px; background: var(--off); color: var(--dim); white-space: nowrap; }
.chip.ok { background: #183d24; color: #8ff0a8; }
.chip.warn { background: #4a2a10; color: #ffc27a; }
.chip.bad { background: #4a1714; color: #ff9d94; }
main { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }
h2 { margin: 22px 0 10px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
button { background: #24282c; color: var(--text); border: 1px solid #3a3f45; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
button:hover { background: #2d3237; }
button:disabled { opacity: .45; cursor: default; }
.focus, button:focus-visible, .module:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.modules { display: flex; flex-direction: column; gap: 10px; }
.module { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 17px; }
.module .name { font-weight: 600; flex: 1; }
.module .about { color: var(--dim); font-size: 13px; }
.module.last .name::after { content: "  last used"; color: var(--dim); font-weight: 400; font-size: 12px; }
.module:disabled .name { color: var(--dim); }
.banner { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: #1f2a1f; border: 1px solid #2c7a45; display: none; }
.banner.on { display: block; }
.banner.learn { background: #2a2310; border-color: #8a6a1f; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tabs button.sel { background: #1f5130; border-color: #2c7a45; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
td, th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
td.code { font-family: var(--mono); color: var(--dim); width: 90px; }
td.code.set { color: #8ff0a8; }
td.acts { white-space: nowrap; }
td.acts button { padding: 4px 9px; font-size: 12px; }
.hint { color: var(--dim); font-size: 13px; }
input[type=number] { width: 64px; background: #24282c; color: var(--text); border: 1px solid #3a3f45; border-radius: 6px; padding: 5px 6px; font: inherit; }
@media (max-width: 560px) { td.code { width: 56px; } td, th { padding: 5px 3px; } .module { font-size: 15px; } }

/* ---- GhettoRack look, shared with the ApcBox page (apcbox.css): LEDs and glowing buttons ---- */
:root{--bg:#0b0c0d;--panel:#15171a;--line:#2a2d31;--text:#d9dcdf;--dim:#7d848c;--green:#35d05a;--red:#ff4b3e;--yellow:#ffb833;--amber:#ff9a1f;--blue:#4aa3ff;--off:#23262a}
body{background:var(--bg);-webkit-tap-highlight-color:transparent}
header{background:#101214;gap:10px 18px;padding:12px 18px}
h1{font-size:18px;letter-spacing:.1em}
h2{letter-spacing:.1em}
.chip{background:none!important;padding:0;display:inline-flex;align-items:center;gap:7px;color:var(--dim)!important;font-size:12px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--off);flex:none}
.chip.ok::before{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.warn::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chip.bad::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.chip.warn,.chip.bad{color:var(--text)!important}
button{background:#1d2024;border:1px solid #3a3f45;border-radius:7px;color:#c3c8cd;font-weight:600;min-height:34px}
button:hover{background:#24282c}
button:disabled{opacity:.35}
button.sel,.tabs button.sel,button.on{background:#1d2024;color:var(--amber);border-color:var(--amber);box-shadow:0 0 9px #ff9a1f77, inset 0 0 8px #ff9a1f33}
button:focus-visible,input:focus-visible,select:focus-visible,.module:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input[type=checkbox]{accent-color:var(--green);width:18px;height:18px;vertical-align:middle}
input[type=number],input[type=text],select{background:#0b0c0d;border:1px solid #3a3f45;color:var(--text);border-radius:6px;min-height:34px}
.panel,.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.banner{border-radius:10px}
#home{height:40px;padding:0 16px}
.module{background:#1d2024;border:1px solid #3a3f45;border-radius:12px;padding:20px 20px;font-size:19px;min-height:76px}
.module .name{letter-spacing:.02em}
.module:not(:disabled):hover{border-color:var(--green)}
.module.last{border-color:var(--green);box-shadow:0 0 14px #35d05a66, inset 0 0 18px #35d05a22}
.module.last .name{color:var(--green)}
.module.last .name::after{color:var(--green);opacity:.7}
.module:disabled{background:#15171a;border-style:dashed}
td.code.set{color:var(--green)}
.banner{background:#15231a;border-color:var(--green)}
.banner.learn{background:#2a2310;border-color:var(--amber)}
@media (max-width: 560px) { .module{flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;font-size:18px;min-height:0} }
</style>
</head>
<body>
<header>
  <h1>GHETTORACK</h1>
  <span id="c-daisy" class="chip">Daisy: ?</span>
  <span id="c-ctl" class="chip">controllers: ?</span>
  <span id="c-ir" class="chip">remote: ?</span>
  <a id="jam" class="chip" href="/jam" style="margin-left:auto;text-decoration:none;color:inherit">Jam recorder</a>
  <a id="settings" class="chip" href="/settings" style="text-decoration:none;color:inherit">⚙ Settings</a>
</header>
<main>
  <h2>Modules</h2>
  <div id="modules" class="modules"></div>
  <div id="countdown" class="banner"></div>
</main>
<script src="/small.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const tv = params.has("tv"), boot = params.has("boot");

/* The 480x320 touch screen (?small): tiles for the modules, the jam recorder and
   Settings, and the start-up countdown as a bar. Frame and parts: small.js. */
function small() {
  const F = Small.frame({ title: "GHETTORACK" }), el = Small.el;
  const root = el("div", "g-start"), tiles = el("div", "g-tiles"), foot = el("div", "g-foot"), bar = el("div", "g-bar"), stay = Small.btn("STAY HERE", () => stop());
  foot.append(bar, stay); root.append(tiles, foot); F.view.appendChild(root);
  let st = null, timer = null, jam = null, bridge = null;
  /* "last used" is the tile opened last on this screen, the jam recorder and Settings included.
     The bridge's own "last" is the module (it sets the MIDI routing and what the box boots into). */
  const mark = () => { try { return localStorage.getItem("gr-last-tile"); } catch (e) { return null; } };
  const go = async m => { stop(); try { localStorage.setItem("gr-last-tile", m.name); } catch (e) {}
    if (m.id) await fetch("/select", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ module: m.id }) }).catch(() => {});
    location.href = Small.url(m.url); };
  function stop() { if (timer) { clearInterval(timer); timer = null; } idle(); }
  function idle() { stay.style.visibility = "hidden"; bar.classList.remove("count");
    bar.textContent = st ? "tap a module" : ""; }
  function draw() {
    if (!st) return;
    tiles.textContent = "";
    const all = st.modules.map(m => ({ id: m.id, name: m.name, about: m.about, url: m.url, ready: m.ready,
        tag: m.ready && m.missing && m.missing.length ? "no " + m.missing.map(n => n === "daisy" ? "Daisy" : n).join(", ") + " yet" : "" }))
      .concat([{ name: "Jam recorder", about: "record what the Daisy plays", url: "/jam", ready: true, tag: jam && jam.recording ? "recording" : "", bad: jam && jam.recording },
               { name: "Settings", about: "network, Bluetooth, remote, system", url: "/settings", ready: true, tag: "" }]);
    const lastMod = st.modules.find(m => m.id === st.last), was = all.find(m => m.name === mark() && m.ready) || all.find(m => lastMod && m.name === lastMod.name);
    if (was) { was.last = true; if (!was.bad) was.tag = "last used"; }
    const cells = Math.max(6, Math.ceil(all.length / 3) * 3);     /* whole rows of three */
    for (let i = 0; i < cells; i++) {
      const m = all[i];
      if (!m) { tiles.appendChild(el("div", "g-tile empty", "")); continue; }
      const b = el("button", "g-tile" + (m.last ? " last" : "")); b.disabled = !m.ready;
      b.append(el("b", "", m.name), el("span", "g-about", m.about), el("span", "g-tag" + (m.bad ? " bad" : ""), m.tag));
      b.onclick = () => go(m); tiles.appendChild(b);
    }
    tiles.style.gridTemplateRows = "repeat(" + cells / 3 + ",minmax(0,1fr))";
    if (!timer) idle();
  }
  function status() { if (!bridge) return;
    const n = (bridge.controllers || []).length;
    F.status(bridge.daisy ? "Daisy ok" + (n ? "   " + n + " controller" + (n > 1 ? "s" : "") : "") : "no Daisy", bridge.daisy ? "ok" : "bad"); }
  function countdown() {
    const m = st.modules.find(x => x.id === st.last && x.ready);
    if (!boot || !m || !st.autostart_s) return;
    let left = st.autostart_s;
    const tick = () => { if (left <= 0) return go(m); bar.textContent = "opening " + m.name + " in " + left + " s"; bar.classList.add("count"); stay.style.visibility = "visible"; left--; };
    tick(); timer = setInterval(tick, 1000);
  }
  /* any touch on the screen stops the countdown (the tile under it still opens) */
  document.addEventListener("pointerdown", e => { if (timer && !(e.target.closest && e.target.closest(".g-tile"))) stop(); }, true);
  const es = new EventSource("/events?view=selector");
  es.addEventListener("bridge", e => { try { bridge = JSON.parse(e.data); if (bridge.jam) jam = bridge.jam; status(); draw(); } catch (err) {} });
  es.addEventListener("jam", e => { try { jam = JSON.parse(e.data); draw(); } catch (err) {} });
  es.addEventListener("irraw", () => stop());
  fetch("/state").then(r => r.json()).then(s => { st = s; draw(); countdown(); }).catch(() => { bar.textContent = "the bridge is not answering"; });
}

function big() {
if (tv) { $("settings").href = "/settings?tv=1"; $("jam").href = "/jam?tv=1"; }
if (tv) document.body.classList.add("tv");
let st = null, countdown = null;

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
async function load() {
  st = await (await fetch("/state")).json();
  render();
}

function moduleUrl(m) { return m.url + (tv ? "?tv=1" : ""); }
async function open(m) {
  if (!m.ready) return;
  stopCountdown();
  await post("/select", { module: m.id }).catch(() => {});
  location.href = moduleUrl(m);
}

function render() {
  const box = $("modules");
  box.textContent = "";
  for (const m of st.modules) {
    const b = document.createElement("button");
    b.className = "module" + (m.id === st.last ? " last" : "");
    b.disabled = !m.ready;
    b.innerHTML = `<span class="name"></span><span class="about"></span>`;
    b.querySelector(".name").textContent = m.name;
    b.querySelector(".about").textContent = m.about + (m.ready && m.missing && m.missing.length
      ? " (no " + m.missing.map(n => n === "daisy" ? "Daisy" : n).join(", ") + " yet)" : "");
    b.onclick = () => open(m);
    box.appendChild(b);
  }
  chip("c-ir", st.ir.device ? "remote: " + (st.ir.name || "found") : "remote: no receiver", st.ir.device ? "ok" : "warn");
}

function chip(id, text, cls) { const c = $(id); c.textContent = text; c.className = "chip " + (cls || ""); }

/* Boot: start the last module unless someone presses something */
function startCountdown() {
  const m = st.modules.find(x => x.id === st.last && x.ready);
  if (!boot || !m || !st.autostart_s) return;
  let left = st.autostart_s;
  const b = $("countdown");
  const tick = () => {
    if (left <= 0) { open(m); return; }
    b.textContent = `Starting ${m.name} in ${left}... press any button to stay here`;
    b.classList.add("on");
    left--;
  };
  tick();
  countdown = setInterval(tick, 1000);
}
function stopCountdown() {
  if (countdown) { clearInterval(countdown); countdown = null; $("countdown").classList.remove("on"); }
}

/* Moving around with the remote or the keyboard: up/down/left/right walk the
   modules and Settings, ok opens one. The remote's buttons, start-up delay and TV
   sound are set in Settings. */
function focusables() { return [...document.querySelectorAll("button:not(:disabled), a[href]")]; }
function move(d) {
  const f = focusables();
  let i = f.indexOf(document.activeElement);
  i = i < 0 ? 0 : Math.max(0, Math.min(f.length - 1, i + d));
  f[i].focus();
  f[i].scrollIntoView({ block: "nearest" });
}
function action(a) {
  stopCountdown();
  if (a === "up" || a === "left") move(-1);
  else if (a === "down" || a === "right") move(1);
  else if (a === "ok") { if (document.activeElement && document.activeElement.click) document.activeElement.click(); }
  else if (a === "back" || a === "home") { const f = focusables(); if (f[0]) f[0].focus(); }
  else if (a === "play" && st) { const m = st.modules.find(x => x.id === st.last && x.ready); if (m) open(m); }
}
document.addEventListener("keydown", e => {
  stopCountdown();
  if (e.target.tagName === "INPUT") return;
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  if (k) { action(k); e.preventDefault(); }
});
document.addEventListener("pointerdown", stopCountdown);

/* Live: bridge status, remote buttons for this view, learning results */
const es = new EventSource("/events?view=selector");
es.addEventListener("bridge", e => {
  try {
    const b = JSON.parse(e.data);
    chip("c-daisy", b.daisy ? "Daisy: connected" : "Daisy: not on the box", b.daisy ? "ok" : "bad");
    const n = (b.controllers || []).map(c => c.name).join(", ");
    chip("c-ctl", n ? "controllers: " + n : "controllers: none", n ? "ok" : "");
    jamLamp(b.jam);
  } catch (err) {}
});
/* the jam recorder's lamp: red while a take runs, whatever module is open */
function jamLamp(j) { if (j) chip("jam", j.recording ? "Jam recorder: recording" : "Jam recorder", j.recording ? "bad" : ""); }
es.addEventListener("jam", e => { try { jamLamp(JSON.parse(e.data)); } catch (err) {} });
es.addEventListener("ir", e => { try { action(JSON.parse(e.data).action); } catch (err) {} });
es.addEventListener("irraw", () => stopCountdown());

load().then(() => {
  startCountdown();
  const first = document.querySelector(".module:not(:disabled)");
  if (first) first.focus();
});
}
if (Small.on) small(); else big();
</script>
</body>
</html>
